label:
  type: text
  comment: The block label, such as "Experience" or "Skills".
labelLevel:
  type: select
  comment: Heading level for the label. Keep the page order logical.
  options:
    values:
      - id: h2
        name: H2
      - id: h3
        name: H3
items:
  type: array
  label: Entries
  comment: Roles, projects, or skill groups. Every field on an entry is optional, so this covers a dated role and a one-line skills group alike.
  options:
    structures: _structures.resumeItems
