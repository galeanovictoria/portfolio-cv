eyebrow:
  type: text
  comment: Small monospaced label above the heading.
heading:
  type: text
  comment: The panel heading.
headingLevel:
  type: select
  comment: Heading level. Keep the page order logical.
  options:
    values:
      - id: h2
        name: H2
      - id: h3
        name: H3
subtext:
  type: markdown
  comment: A supporting line beneath the heading.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    bulletedlist: false
    numberedlist: false
doodleSource:
  type: image
  label: Doodle
  comment: Optional decorative mark above the eyebrow.
  options:
    paths:
      uploads: public/assets/doodle
      static: public
buttonSections:
  type: array
  comment: Buttons pushed to the right of the panel.
  options:
    structures: _structures.buttonSections
