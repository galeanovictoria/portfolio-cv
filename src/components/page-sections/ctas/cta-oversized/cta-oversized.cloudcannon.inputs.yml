eyebrow:
  type: text
  comment: Small monospaced label above the heading.
heading:
  type: text
  comment: The oversized closing line. Keep it short — it is set very large.
headingLevel:
  type: select
  comment: Heading level. Keep the page order logical.
  options:
    values:
      - id: h2
        name: H2
      - id: h3
        name: H3
headingLink:
  type: url
  comment: Optional destination for the heading itself, such as a mailto link.
doodleSource:
  type: image
  label: Doodle
  comment: Optional decorative mark above the eyebrow.
  options:
    paths:
      uploads: public/assets/doodle
      static: public
buttonSections:
  type: array
  comment: Contact pills beneath the heading.
  options:
    structures: _structures.buttonSections
