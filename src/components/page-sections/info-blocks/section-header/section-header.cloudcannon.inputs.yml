heading:
  type: text
  comment: The section title.
headingLevel:
  type: select
  comment: Heading level. Keep the page order logical — usually h2.
  options:
    values:
      - id: h2
        name: H2
      - id: h3
        name: H3
note:
  type: text
  comment: Small monospaced note pushed to the far edge, such as "01 — 05 / case studies".
doodleSource:
  type: image
  label: Doodle
  comment: Optional decorative mark beside the heading.
  options:
    paths:
      uploads: public/assets/doodle
      static: public
